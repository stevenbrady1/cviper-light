# Keeps the SHA pins and the dependencies current (L-222).
#
# Every GitHub Action is pinned to a full commit SHA, so a moved tag cannot
# change what runs with the release signing key. Pins nobody updates rot into
# known-vulnerable versions, so Dependabot proposes the updates — weekly,
# grouped into one PR per ecosystem, at most two open at a time, so a phone
# can keep up with them. The cooldown matches pnpm's minimum release age: a
# release has to have been public for a week before it is proposed.
#
# `actions-pinned-by-sha.contract.test.ts` fails if any of the three
# ecosystems below disappears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
    # Majors that break the build are planned migrations, not weekly bumps.
    # One breaking major turns the whole grouped PR red and blocks every safe
    # update behind it (#286). TypeScript 7 drops the compiler API that
    # src/lib/copy-text.ts imports; Vitest 5 is a major for the test runner.
    # Remove an entry in the PR that does that migration.
    # dependabot-holds-breaking-majors.contract.test.ts holds these here.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /apps/light/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ['*']
