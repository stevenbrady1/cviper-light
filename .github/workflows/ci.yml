name: CI

# Every push and every pull request. There is no path filter: a change-detection
# rule that skips the frontend job on a "backend-only" commit is how latent
# failures end up sitting on a green main.
on:
  push:
  pull_request:

# Least privilege, and `contents: read` is named explicitly. A job with a
# `permissions:` block that omits it cannot check the repository out.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack asks, interactively, before downloading a package manager it has
  # not seen. On a runner that prompt is an eleven-minute hang ending in a
  # timeout with no useful log.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    # ==========================================================================
    # WINDOWS, NOT UBUNTU. THIS IS THE WHOLE POINT OF THE JOB.
    # ==========================================================================
    # The app ships as a Windows desktop binary. Ubuntu is faster and cheaper
    # and hides exactly the three things that break this codebase: path
    # separators (`relative()` returns backslashes, which several guards
    # normalise), line endings, and the MSVC toolchain the Tauri side is
    # actually compiled with.
    #
    # A green Linux build of a Windows app is a green build of something else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # Before setup-node, because `cache: pnpm` needs a pnpm binary to ask
      # where the store lives.
      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the Cargo.lock under src-tauri. Without it every run rebuilds
      # the whole Tauri dependency tree, which is the difference between a
      # three-minute check and a twenty-minute one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/light/src-tauri

      # ------------------------------------------------------------------
      # The five checks, individually rather than through `pnpm verify`, so a
      # failure names itself in the job summary instead of being reported as
      # "verify failed".
      # ------------------------------------------------------------------
      - name: Typecheck
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Cargo check
        run: pnpm cargo:check

      # `cargo check` does not compile `#[cfg(test)]` code, so without this line
      # every Rust test in the repository is a guard that looks green because
      # nothing ever asked it a question.
      - name: Cargo test
        run: pnpm cargo:test

      # The Vite build only. NEVER `tauri build` — a release bundle is a signed
      # artefact produced by release.yml, which alone is given the signing
      # secrets. Running it here would burn ten minutes producing nothing
      # shippable.
      - name: Build the frontend
        run: pnpm --filter @cviper/light build

      - name: Check formatting
        run: pnpm format:check

  # ------------------------------------------------------------------
  # No key of ours is ever compiled into this app (hosted ADR 012, R-COST).
  # Three surfaces: every reachable commit, the working tree, and the BUILT
  # web bundle — the last is what ships inside the installer's webview and is
  # where a key pasted "just for a minute" during development would end up.
  # The source-level half of the same promise is
  # apps/light/src/lib/no-baked-in-key.contract.test.ts.
  # ------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so a key committed and then "removed" is still found.
          fetch-depth: 0

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Vite build only — never `tauri build` (see the verify job).
      - name: Build the web bundle that ships inside the installer
        run: pnpm --filter @cviper/light build

      # Pinned by version AND checksum. A scanner fetched as "latest" is a
      # supply-chain step nobody reviewed.
      - name: Install gitleaks 8.24.3
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan every commit reachable from this ref
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .

      - name: Scan the working tree
        run: ./gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 1 apps packages

      - name: Scan the built bundle
        run: ./gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 1 apps/light/dist
