name: Release

# ============================================================================
# THE ONLY PLACE A SIGNED, SHIPPABLE BUILD IS PRODUCED.
# ============================================================================
# There are exactly TWO ways in, and no third:
#
#   PUSH a `light-v*` tag          -> `bundle` builds the installers into a
#                                     DRAFT release named after that tag.
#   DISPATCH with `promote_tag`    -> `promote-manifest` publishes an
#                                     already-reviewed release's `latest.json`.
#
# A dispatch with `promote_tag` left empty is neither, and it FAILS (L-118). It
# used to fall through to `bundle`, which had no tag and invented one from the
# run number — a draft tagged `light-v2` whose `latest.json` said `0.1.0`.
#
# Nothing about any of it is automatic: it produces a DRAFT release, always, and
# a person presses publish.
#
# smoke.yml also runs `tauri build` (L-88), and deliberately produces something
# that CANNOT be shipped: unsigned, with `createUpdaterArtifacts` overridden to
# false, uploaded as a 7-day artefact and never published. This file remains the
# only path to an installer an existing copy of the app can update to.
on:
  push:
    tags:
      - 'light-v*'
  workflow_dispatch:
    inputs:
      promote_tag:
        description: >-
          Publish the updater manifest from an ALREADY-PUBLISHED release, e.g.
          light-v0.1.0. Leaving this empty FAILS the run: bundling a new draft
          is started by pushing a light-v* tag, never by running this workflow
          by hand. See "Releasing: the human steps, in order" in
          apps/light/src-tauri/RELEASE-SIGNING.md.
        required: false
        default: ''

# `contents: write` because the job creates a release and uploads assets to it.
# Nothing else is granted.
permissions:
  contents: write

jobs:
  # ==========================================================================
  # A BARE DISPATCH IS A MISTAKE, AND THIS SAYS SO OUT LOUD (L-118).
  # ==========================================================================
  # Running this workflow by hand with nothing filled in used to BUILD A
  # RELEASE. `bundle` ran on any dispatch that was not a promotion, had no
  # pushed tag to name the release after, and filled one in from the run
  # number — so a draft appeared tagged `light-v2` carrying a `latest.json`
  # that said `0.1.0`. The tag and the version disagreed and nothing objected.
  #
  # The fallback is gone, which leaves a bare dispatch with nothing to do. It
  # must not do that nothing QUIETLY: a run in which every job skips is a green
  # tick, and a green tick on a workflow called Release is read as "the release
  # went out". So it fails here, in a sentence, naming what it could have meant.
  refuse-a-bare-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag == ''

    runs-on: ubuntu-latest

    # Reads nothing, writes nothing, checks nothing out. This job only prints
    # and exits.
    permissions:
      contents: read

    steps:
      - name: A release starts with a tag push, not with this button
        shell: bash
        run: |
          set -eu
          echo 'This workflow was run by hand with promote_tag empty, and that is not a way to'
          echo 'start a release. Nothing was built and nothing was published.'
          echo ''
          echo 'There are two ways in:'
          echo ''
          echo '  1. To build a new release: push a light-v* tag. The bundle job builds the'
          echo '     installers into a DRAFT release named after that tag. Review it, then'
          echo '     publish it as a pre-release.'
          echo '  2. To point existing installs at a release you have already published: run'
          echo '     this workflow with promote_tag set to that tag.'
          echo ''
          echo 'See "Releasing: the human steps, in order" in apps/light/src-tauri/RELEASE-SIGNING.md.'
          echo "::error title=Nothing to do, so nothing was done::promote_tag was empty. Push a light-v* tag to build a release, or dispatch this workflow with promote_tag set to an already-published tag to promote its updater manifest. See section 3 of apps/light/src-tauri/RELEASE-SIGNING.md."
          exit 1

  bundle:
    # A PUSHED TAG AND NOTHING ELSE.
    #
    # Both halves matter. `ref_type == 'tag'` alone would still let a dispatch
    # aimed at a tag ref from the Actions UI reach the bundler, and a dispatch
    # means "promote a manifest" — never "build me a release". `event_name ==
    # 'push'` alone would let a branch push in, with no tag to name the release
    # after, which is the state the invented tag came out of.
    if: github.event_name == 'push' && github.ref_type == 'tag'

    strategy:
      # One platform failing must not cancel the other. A Windows build that
      # succeeded is still worth having in the draft while macOS is fixed.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            args: ''
          # ------------------------------------------------------------------
          # macOS. WHAT IS OUTSTANDING IS A CERTIFICATE, NOT AN ACCOUNT.
          # ------------------------------------------------------------------
          # The Apple Developer Program account exists (team TT8K4YT4TQ). What
          # does not yet exist is a DEVELOPER ID APPLICATION certificate and the
          # five repository secrets that carry it:
          #
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          #
          # Until all five are set this leg SKIPS, visibly, in a step of its own
          # that says so — and the Windows leg still ships. What it must never
          # do again is attempt to sign with blanks, which is how light-v0.1.0
          # died:
          #
          #   failed codesign application: failed to run command security
          #   import: failed to import keychain certificate
          #
          # An unset secret is not undefined. GitHub expands it to an EMPTY
          # STRING, so an absent certificate arrives looking present and the
          # bundler asks `security import` to import nothing. Telling those
          # states apart is the whole job of the classifier step below.
          #
          # `target` and `args` differ ON PURPOSE. `target` is the list of
          # rustup targets to INSTALL; `args` is what the bundler is asked to
          # produce. `universal-apple-darwin` is NOT a rustup target — it is a
          # Tauri pseudo-target lipo'd from the two real slices, so both have to
          # be installed or the universal build cannot link.
          #
          # Universal, not Apple Silicon only: an aarch64 bundle handed to
          # somebody on an Intel Mac does not run, and it fails on their machine
          # rather than in CI.
          - platform: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      # ======================================================================
      # THE THREE STATES OF THE APPLE SIGNING SECRETS.
      # ======================================================================
      # FIRST, before the toolchain and the dependencies, so a misconfigured
      # release fails in seconds instead of after a build.
      #
      # The `secrets` context is not available in a job-level `if:`, in
      # `strategy`, or even in a step-level `if:` — only in `env`, `with` and
      # `run`. So the question is asked HERE, once, in `env`, and the answer
      # travels to the steps that need it as a step OUTPUT, which `if:` can
      # read.
      #
      # Three states, three visibly different outcomes:
      #
      #   all five set  -> signing=yes, a notice, and a signed notarised build
      #   none set      -> signing=no, a warning, no Mac artefact at all
      #   SOME set      -> the job FAILS here, naming the missing ones
      #
      # The middle state is the dangerous one and it is why this step exists: a
      # blank secret is indistinguishable from a real one to anything that only
      # asks whether it is there.
      #
      # Only secret NAMES are ever printed. No value is echoed.
      - name: Classify the Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu

          present=''
          missing=''

          record() {
            if [ -n "$2" ]; then
              present="$present $1"
            else
              missing="$missing $1"
            fi
          }

          record APPLE_CERTIFICATE "${APPLE_CERTIFICATE:-}"
          record APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD:-}"
          record APPLE_ID "${APPLE_ID:-}"
          record APPLE_PASSWORD "${APPLE_PASSWORD:-}"
          record APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"

          if [ -z "$missing" ]; then
            echo "signing=yes" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS will be signed::All five Apple secrets are set. This leg builds, signs and notarises a universal binary."
            exit 0
          fi

          if [ -z "$present" ]; then
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS leg skipped::No Apple signing secrets are set, so this run produces no macOS artefact. The Windows leg is unaffected."
            exit 0
          fi

          echo "signing=partial" >> "$GITHUB_OUTPUT"
          echo "::error title=macOS signing is misconfigured::SET:$present -- MISSING:$missing. A missing secret arrives as an empty string and would be handed to the signer as though it were real. Set the missing secrets, or unset all five to skip the leg deliberately."
          exit 1

      # A skipped macOS leg must never be mistakable for a built one. This step
      # appears in the job only in the skip case, and writes the reason into the
      # run summary where somebody looking at a green run will actually see it.
      - name: macOS SKIPPED - no Developer ID certificate
        if: runner.os == 'macOS' && steps.apple.outputs.signing == 'no'
        shell: bash
        run: |
          set -eu
          {
            echo '## macOS: skipped, nothing was built'
            echo ''
            echo 'No Apple signing secrets are set on this repository, so this run produced NO macOS artefact.'
            echo 'This is not a signed build and it is not a failed build - it is an absent one.'
            echo ''
            echo 'To switch it on: create a Developer ID Application certificate under team TT8K4YT4TQ,'
            echo 'then set all five of APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,'
            echo 'APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Comma-separated. On macOS this installs BOTH darwin slices, which is
      # what `--target universal-apple-darwin` is lipo'd from; on Windows the
      # matrix leaves it empty and nothing extra is installed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/light/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The setup steps above run even on a skipped macOS leg. That is a couple
      # of wasted minutes in the one case where nothing ships anyway, and it is
      # preferred to putting the same `if:` on seven steps, where the cost of
      # getting one of them wrong is a build that signs when it should not.
      - uses: tauri-apps/tauri-action@v0
        # Windows always. macOS ONLY when the classifier found all five secrets
        # — never on a partial set, which has already failed the job above, and
        # never on none, which skipped with a notice.
        if: runner.os != 'macOS' || steps.apple.outputs.signing == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ==================================================================
          # SECRETS ARE NAMED HERE AND SET IN THE REPOSITORY. NEVER IN A FILE.
          # ==================================================================
          # The signing keypair is generated by a human with
          # `pnpm tauri signer generate` and never enters version control — see
          # apps/light/src-tauri/RELEASE-SIGNING.md. Until these are set, and
          # until `plugins.updater.pubkey` is a real key, this job fails at the
          # bundling step. That failure is correct: an unsigned update is one no
          # installed copy can verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarisation. Reachable only on the macOS leg and only when
          # the classifier above proved all five are non-empty, so they are
          # never blank here.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/light
          # The tag that was pushed, and no fallback. The job cannot be reached
          # without one (see the `if:` above), so there is no state left for a
          # fallback to cover — only a state for it to invent a name in.
          tagName: ${{ github.ref_name }}
          releaseName: 'CViper Light ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          # ==================================================================
          # ALWAYS A DRAFT. NOT A SETTING SOMEBODY SHOULD FLIP.
          # ==================================================================
          # Publishing is the moment every existing install starts downloading
          # this build. That decision belongs to a person who has looked at the
          # artefacts, not to a tag push that might have been a typo.
          releaseDraft: true
          prerelease: false
          # Produces `latest.json`, which is the file the updater endpoint in
          # tauri.conf.json actually reads. Without it the release contains
          # installers no existing copy of the app can ever discover.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # ==========================================================================
  # PROMOTE THE MANIFEST. THE SECOND PRESS, AFTER A PERSON HAS LOOKED.
  # ==========================================================================
  # THE HUMAN STEPS, IN ORDER. Nothing below happens on its own.
  #
  #   1. Push a `light-v*` tag. The `bundle` job above builds and uploads a
  #      DRAFT release. Nothing is public and no installed copy can see it.
  #   2. REVIEW THE DRAFT. Download the installer, run it, check the version.
  #      This is the step the draft gate exists to make possible.
  #   3. PUBLISH THE DRAFT AS A PRE-RELEASE. Pre-release, not latest, because
  #      the direct-download installers are unsigned and SmartScreen warns
  #      about them — they are not a headline download.
  #   4. Run this workflow by hand (Actions -> Release -> Run workflow) with
  #      `promote_tag` set to the tag you just published. THAT is the moment
  #      existing installs start seeing the update.
  #
  # WHY A JOB AND NOT "COPY THE FILE ACROSS BY HAND".
  # Copying by hand has none of the properties that matter here: it runs no
  # verification, it leaves no record of what was published or by whom, it can
  # upload the wrong file, and it can forget `--clobber` and silently leave the
  # old manifest in place. It is also the step that gets skipped at eleven at
  # night. A dispatch job cannot skip its own verification, and every promotion
  # leaves a log.
  #
  # Step 4 is deliberately SEPARATE from step 1 rather than being chained onto
  # a published-release trigger: a release can be published for reasons that
  # have nothing to do with the updater — re-uploading an asset, fixing the
  # notes — and none of those should re-point every installed copy.
  promote-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''

    runs-on: ubuntu-latest

    # `contents: write` because it uploads an asset. Named explicitly so the
    # job can also check the repository out.
    permissions:
      contents: write

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # Without a repository to resolve, `gh` dies with "failed to determine
      # base repo".
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.promote_tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # A DRAFT's assets are not downloadable by anyone but a collaborator, so
      # promoting one would publish a manifest pointing at URLs that 404 for
      # every user. This fails loudly rather than producing a broken channel.
      - name: Refuse a release that is still a draft
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          echo "$TAG isDraft=$draft"
          if [ "$draft" != "false" ]; then
            echo "::error title=That release is still a draft::$TAG has not been published. A draft's assets are not downloadable by users, so the manifest would point at URLs that 404 for everyone. Publish it as a pre-release first."
            exit 1
          fi

      # Every asset, so the installers the manifest names sit next to it and
      # the verifier can check the signatures against the real bytes.
      - name: Download the release assets
        run: |
          set -euo pipefail
          mkdir -p promote
          gh release download "$TAG" --dir promote --clobber
          ls -l promote

      # ====================================================================
      # THE GATE. NOTHING IS PUBLISHED PAST THIS LINE WITHOUT IT PASSING.
      # ====================================================================
      # Missing manifest, unparseable manifest, or a signature made by a key
      # the shipped binaries do not carry -> this exits 1 and the job stops.
      # `--bundle-dir` makes it a real signature verification against the
      # downloaded installers rather than only a key-id check.
      - name: Verify the manifest before anything is published
        run: pnpm verify:updater-manifest promote/latest.json --bundle-dir promote

      # The permanent release the endpoint in tauri.conf.json points at. It is
      # created once and then only ever has its asset replaced. A pre-release
      # so it never takes GitHub's "Latest" badge from a real version.
      - name: Make sure the permanent updater release exists
        run: |
          set -euo pipefail
          if gh release view updater >/dev/null 2>&1; then
            echo "The updater release already exists; its asset will be replaced."
          else
            echo "Creating the permanent updater release."
            gh release create updater \
              --title "Updater manifest" \
              --prerelease \
              --notes "Not a download. This release exists only to hold \`latest.json\` at an address that never changes, which is what every installed copy of CViper Light reads to discover a new version. Its contents are replaced by the Release workflow. See apps/light/src-tauri/RELEASE-SIGNING.md."
          fi

      - name: Publish the manifest
        run: |
          set -euo pipefail
          gh release upload updater promote/latest.json --clobber
          echo "### Updater manifest promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`latest.json\` from **$TAG** is now live at the fixed updater endpoint." >> "$GITHUB_STEP_SUMMARY"
          echo "Every installed copy will see this version on its next check." >> "$GITHUB_STEP_SUMMARY"
