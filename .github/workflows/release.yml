name: Release

# ============================================================================
# THE ONLY PLACE A SIGNED, SHIPPABLE BUILD IS PRODUCED.
# ============================================================================
# Triggered by a `light-v*` tag, or by hand. Nothing about it is automatic: it
# produces a DRAFT release, always, and a person presses publish.
#
# smoke.yml also runs `tauri build` (L-88), and deliberately produces something
# that CANNOT be shipped: unsigned, with `createUpdaterArtifacts` overridden to
# false, uploaded as a 7-day artefact and never published. This file remains the
# only path to an installer an existing copy of the app can update to.
on:
  push:
    tags:
      - 'light-v*'
  workflow_dispatch:

# `contents: write` because the job creates a release and uploads assets to it.
# Nothing else is granted.
permissions:
  contents: write

jobs:
  bundle:
    strategy:
      # One platform failing must not cancel the other. A Windows build that
      # succeeded is still worth having in the draft while macOS is fixed.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            args: ''
          # ------------------------------------------------------------------
          # macOS IS COMMENTED OUT UNTIL THERE IS AN APPLE DEVELOPER ACCOUNT.
          # ------------------------------------------------------------------
          # It is not that the build is broken. It reached codesigning and died
          # there, on light-v0.1.0:
          #
          #   failed codesign application: failed to run command security
          #   import: failed to import keychain certificate
          #
          # The APPLE_* secrets below are referenced but not set, so GitHub
          # expands each to an EMPTY STRING rather than leaving it undefined.
          # Tauri sees APPLE_CERTIFICATE as present-and-blank, tries to import
          # a certificate that is not there, and fails. An absent variable
          # would have been skipped; an empty one is worse than none.
          #
          # Enabling it is not worth doing before enrolment either way: an
          # unsigned .app is refused by Gatekeeper on every Mac but the one
          # that built it, so the artefact would be unshippable even if the
          # build went green.
          #
          # TO TURN IT BACK ON: enrol in the Apple Developer Program, add
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets, then
          # uncomment the three lines below.
          #
          # Apple Silicon only, deliberately. A universal binary doubles the
          # download for every user to serve Intel Macs Apple stopped selling,
          # and the x86_64 slice cannot be tested on any machine this project
          # has.
          #
          # - platform: macos-latest
          #   target: aarch64-apple-darwin
          #   args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/light/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ==================================================================
          # SECRETS ARE NAMED HERE AND SET IN THE REPOSITORY. NEVER IN A FILE.
          # ==================================================================
          # The signing keypair is generated by a human with
          # `pnpm tauri signer generate` and never enters version control — see
          # apps/light/src-tauri/RELEASE-SIGNING.md. Until these are set, and
          # until `plugins.updater.pubkey` is a real key, this job fails at the
          # bundling step. That failure is correct: an unsigned update is one no
          # installed copy can verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarisation. Only read on the macOS leg; absent on Windows,
          # where they are simply unused rather than empty-and-wrong.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/light
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('light-v{0}', github.run_number) }}
          releaseName: 'CViper Light ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          # ==================================================================
          # ALWAYS A DRAFT. NOT A SETTING SOMEBODY SHOULD FLIP.
          # ==================================================================
          # Publishing is the moment every existing install starts downloading
          # this build. That decision belongs to a person who has looked at the
          # artefacts, not to a tag push that might have been a typo.
          releaseDraft: true
          prerelease: false
          # Produces `latest.json`, which is the file the updater endpoint in
          # tauri.conf.json actually reads. Without it the release contains
          # installers no existing copy of the app can ever discover.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
