[package]
name = "light"
version = "0.1.0"
description = "CViper Light — local-first CV and job-search desktop app"
authors = ["CViper"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ============================================================================
# `wdio` IS A TEST-ONLY FEATURE. IT MUST NEVER BE ON IN ANYTHING THAT SHIPS.
# ============================================================================
# It compiles `tauri-plugin-wdio-webdriver` in: an embedded W3C WebDriver
# server listening on a local HTTP port. That is exactly what the CI smoke job
# needs in order to drive the real app, and exactly what must never reach a
# user. The plugin's own README puts it plainly: "This plugin exposes
# automation capabilities via HTTP. Never include it in production builds."
#
# It is deliberately absent from any `default` list. `.github/workflows/smoke.yml`
# turns it on explicitly; release.yml does not and cannot do so by accident.
# Three independent things hold that line:
#
#   1. the dependency below is `optional`, so without the feature it is neither
#      compiled nor even fetched;
#   2. `src/lib.rs` carries a `compile_error!` that fails the build outright if
#      the feature is ever enabled without debug assertions — i.e. in a release;
#   3. `apps/light/src/lib/no-automation-server-in-shipped-builds.contract.test.ts`
#      fails if this feature joins a default list, if `lib.rs` registers the
#      plugin unguarded, or if release.yml or ci.yml ever pass `--features wdio`.
#
# Upstream suggests `[target.'cfg(debug_assertions)'.dependencies]` instead.
# That is weaker: it would put an automation server in EVERY debug build,
# including a developer's own. An explicit opt-in feature is the narrower door.
#
# ============================================================================
# `updater` IS ON BY DEFAULT AND IS OFF FOR THE MICROSOFT STORE (L-93).
# ============================================================================
# An installed MSIX's files are READ-ONLY. `tauri-plugin-updater` works by
# replacing the installed binary, so in a Store build it cannot succeed — it can
# only fail, on a machine where the Store is already handling updates properly.
#
# So the Store flavour is compiled WITHOUT it:
#
#     tauri build --features microsoft-store -- --no-default-features
#
# `optional = true` on the dependency below is what makes that a real gate
# rather than a naming convention: with the feature off the crate is not
# compiled and not even downloaded, exactly as with `wdio`.
#
# `default = ["updater"]` keeps every OTHER build — release.yml, smoke.yml,
# ci.yml, a developer's `cargo check` — unchanged, and means a Store build has
# to ASK for the plugin's absence rather than a normal build having to ask for
# its presence. A gate that fails open is not a gate.
#
# `microsoft-store` compiles nothing of its own. It exists so the two halves
# cannot come apart: `src/lib.rs` raises a `compile_error!` if it is ever on at
# the same time as `updater`, so a Store build that did not receive
# `--no-default-features` does not compile at all rather than quietly shipping
# an updater that cannot work. `src/lib/msix-store-build.contract.test.ts` holds
# the rest of the chain.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
microsoft-store = []
wdio = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tauri add sql` installs this WITHOUT a database backend feature, which leaves
# the plugin inert at runtime. The "sqlite" feature is mandatory — do not remove.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# Test-only, behind the `wdio` feature declared above — read that comment before
# touching this line. `optional = true` is what makes the feature a real gate
# rather than a naming convention: with the feature off, this is not compiled
# into the binary and is not even downloaded.
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
# Secret storage. We write our own Tauri commands over this in Phase 1 — there is
# no official Tauri keyring plugin, and the crates.io lookalike is abandoned.
# Default features (= "v1") pull in the OS-native stores, incl. windows-native.
keyring = "4.1.6"
# HTTP for the provider transport commands (src/providers.rs). Already in the
# tree via tauri-plugin-updater; named here because we call it directly.
#
# `default-features = false` avoids pulling reqwest's `default-tls`, which would
# add the aws-lc-rs crypto backend (a cmake/nasm build) on top of the rustls
# stack the updater already brings. `rustls-no-provider` is the same feature the
# updater selects, so the two unify to one TLS stack rather than two.
#
# NOTE: `rustls-no-provider` deliberately selects NO crypto provider, so one is
# installed explicitly in `providers::client()`. See the `rustls` dependency
# below for what went wrong when that was left to a plugin's side effect.
#
# The "query" feature is what `RequestBuilder::query()` lives behind in reqwest
# 0.13, and it is required rather than convenient: the job-board transport
# (src/jobs.rs) puts user-typed keywords into a query string, and hand-rolling
# percent-encoding is exactly the kind of code that lets an `&` in a job title
# start a parameter of its own. The feature pulls in `serde_urlencoded` and
# `serde`, both of which are already in the tree.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "query",
] }

# URL parsing for the one-page fetch (src/fetch_page.rs). Already in the tree as
# reqwest's own dependency — reqwest re-exports `Url` but not `Host`, and
# `Host` is what lets the SSRF guard match on "IPv4 literal / IPv6 literal /
# name" exactly, instead of unpicking square brackets out of a string.
url = "2.5"

# The crypto provider for the TLS stack above, and a DIRECT dependency on
# purpose.
#
# `rustls-no-provider` selects no provider at all, and reqwest 0.13 does not
# report that as an error — `default_rustls_crypto_provider()` is an
# unconditional `panic!` reached from inside `ClientBuilder::build()`, so
# `.build().ok()` cannot catch it and a panic in a Tauri command takes the whole
# window with it.
#
# An earlier note here said the process-default provider "comes from
# tauri-plugin-updater enabling rustls/ring". The FEATURE does come from there,
# but the feature is not the installation: the updater calls
# `install_default()` inside its `check()` function, so until an update check
# has run there is no default provider and the first AI or job-board request
# kills the window. `providers::client()` now installs it explicitly, and
# `the_shared_client_builds_without_an_update_check_first` is the test that
# would have caught this.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only AND feature-gated — read the `[features]` note above before
# touching this line. `optional = true` is what lets the Microsoft Store flavour
# be built without an updater that could never work on a read-only MSIX install;
# it is in `default`, so nothing else changes.
tauri-plugin-updater = { version = "2", optional = true }

# iOS has no file-based keychain, and `keyring`'s default (`v1`) facade installs
# NO store there: every `keyring::Entry::new` answers `NoDefaultStore`. The
# store Apple does provide on a phone is the data-protection keychain, which
# lives behind this crate's `protected` feature — without that feature the crate
# refuses to compile for iOS at all (`compile_error!`, L-82). `secrets.rs`
# installs it as the default store before the first entry is made.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
keyring-core = "1.0.0"

