packages:
  - 'packages/*'
  - 'apps/*'

# One specifier, referenced as `catalog:` from every package.json that needs it.
#
# `typescript` is declared TWICE — the root typechecks and lints with it, and
# `apps/light` imports it directly in `lib/events.contract.test.ts`. Two literal
# version strings for one tool drift the moment somebody bumps one of them, and
# pnpm answers a disagreement by installing both versions. The guard would then
# parse with a different compiler from the one `tsc` typechecks with, which is
# the failure it was written to prevent.
#
# A catalog removes the second string rather than adding a test to police it.
catalog:
  typescript: '~6.0.3'

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - turbo@2.10.11
  - vitest@4.1.11
